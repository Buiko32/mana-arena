<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accesso · Mana Arena</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1.5rem;background:#0b1418;color:#f1f2e9;font:16px system-ui,sans-serif}main{width:min(100%,440px);padding:2rem;border:1px solid #38504b;background:#111e21} .brand{color:#a5ead7;letter-spacing:.14em;font-size:.8rem;font-weight:700}h1{font-size:2rem;margin:1rem 0 .6rem}p{color:#b7c9c3;line-height:1.5}form{display:grid;gap:1rem;margin-top:1.5rem}label{display:grid;gap:.5rem;font-weight:600}input,button{font:inherit;min-height:48px;padding:.7rem .85rem;border-radius:3px}input{background:#0b1418;border:1px solid #60776f;color:#fff}input:focus{outline:2px solid #a5ead7;outline-offset:2px}button{border:0;background:#a5ead7;color:#10221c;font-weight:700;cursor:pointer}button:disabled{opacity:.6;cursor:wait}#error{color:#ffb7ae;margin:0} [hidden]{display:none}
  </style>
</head>
<body>
  <main>
    <div class="brand">✦ MANA ARENA</div>
    <h1>Accedi all’arena</h1>
    <p>Inserisci la password di accesso per autorizzare questo dispositivo.</p>
    <form id="access-form" method="post" action="/api/access/login">
      <label>Password<input type="password" name="password" autocomplete="current-password" required autofocus></label>
      <p id="error" role="alert" hidden></p>
      <button type="submit">Accedi</button>
    </form>
  </main>
  <script>
    document.querySelector('#access-form').addEventListener('submit', async event => {
      event.preventDefault();
      const form = event.currentTarget, button = form.querySelector('button'), error = document.querySelector('#error');
      button.disabled = true; error.hidden = true;
      try {
        const response = await fetch('/api/access/login', {method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json'}, body:JSON.stringify({password:form.elements.password.value})});
        if (!response.ok) {
          let data = {}; try { data = await response.json(); } catch {}
          throw new Error(typeof data.detail === 'string' ? data.detail : data.detail?.message || 'Accesso non riuscito. Riprova.');
        }
        location.reload();
      } catch (problem) { error.textContent = problem.message || 'Accesso non riuscito. Riprova.'; error.hidden = false; button.disabled = false; }
    });
  </script>
</body>
</html>
