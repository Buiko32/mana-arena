name: Test and publish container

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      verify_public_only:
        description: "Verify anonymous pull and runtime of the already-public latest image"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  tests:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.verify_public_only) }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run test suite
        run: python -m pytest -q
      - name: Check browser scripts and bracket tests
        run: |
          node --version
          node --check app/static/brackets.js
          node --check app/static/app.js
          node --test tests/brackets.test.cjs

  build-and-publish:
    if: ${{ github.event_name != 'pull_request' && !(github.event_name == 'workflow_dispatch' && inputs.verify_public_only) }}
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the amd64 image for a container smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ghcr.io/buiko32/mana-arena:ci-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Buiko32/mana-arena
      - name: Validate Compose using fake local credentials
        shell: bash
        run: |
          trap 'rm -f .env' EXIT
          printf '%s\n' 'DATA_DIR=/data' 'ADMIN_USERNAME=ci-organizer' 'ADMIN_PASSWORD=CI-only-admin-password-42' 'SESSION_SECRET=ci-only-session-secret-with-more-than-32-bytes' 'COOKIE_SECURE=false' > .env
          docker compose -f docker-compose.yaml config --quiet
      - name: Smoke-test the exact built image
        run: python scripts/smoke_container.py --image ghcr.io/buiko32/mana-arena:ci-${{ github.sha }}
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image
        shell: bash
        env:
          SOURCE_TAG: ghcr.io/buiko32/mana-arena:ci-${{ github.sha }}
          SHA_TAG: ghcr.io/buiko32/mana-arena:${{ github.sha }}
          LATEST_TAG: ghcr.io/buiko32/mana-arena:latest
          VERSION: ${{ github.ref_name }}
          REF: ${{ github.ref }}
        run: |
          docker tag "$SOURCE_TAG" "$SHA_TAG"
          docker tag "$SOURCE_TAG" "$LATEST_TAG"
          docker push "$SHA_TAG"
          docker push "$LATEST_TAG"
          if [[ "$REF" == refs/tags/v* ]]; then
            docker tag "$SOURCE_TAG" "ghcr.io/buiko32/mana-arena:$VERSION"
            docker push "ghcr.io/buiko32/mana-arena:$VERSION"
          fi

  anonymous-public-pull:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_public_only }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the smoke helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pull the public image without registry credentials
        run: docker pull ghcr.io/buiko32/mana-arena:latest
      - name: Smoke-test anonymous pull, health, access control, and persistence
        run: python scripts/smoke_container.py --image ghcr.io/buiko32/mana-arena:latest
